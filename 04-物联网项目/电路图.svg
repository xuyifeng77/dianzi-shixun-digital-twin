<path d="M790 282 H840"/><path d="M790 328 H840"/><path d="M790 374 H840"/>
<path d="M790 420 H840"/><path d="M790 477 H840"/>
<path d="M790 534 H840"/><path d="M790 559 H840"/><path d="M790 584 H840"/><path d="M790 609 H840"/>
</g>

<!-- I2C 总线主干：A4/A5 → PCF8591 + LCD/OLED -->
<g stroke="#2B6CB0" stroke-width="2.2" fill="none">
<path d="M470 516 H440"/><path d="M470 546 H440"/>
<path d="M440 516 V690"/><path d="M440 690 H1010"/>
<path d="M1010 690 V720"/>
</g>
<text x="452" y="676" font-size="11" fill="#2B6CB0">I2C</text>

<!-- USB -->
<path d="M630 630 V720" stroke="#276749" stroke-width="2.6" stroke-dasharray="10 5 2 5" fill="none"/>
<text x="642" y="700" font-size="12" fill="#276749">USB 串口 115200</text>

<!-- 独立 5V 线 -->
<g stroke="#C53030" stroke-width="2" fill="none" stroke-dasharray="6 4">
<path d="M1180 634 H1204 V420 H1180"/>
<path d="M1204 477 H1180"/>
</g>

<!-- ===== Duo ===== -->
<rect x="470" y="720" width="320" height="90" rx="10" fill="#F0FFF4" stroke="#276749" stroke-width="2.5"/>
<text x="630" y="752" text-anchor="middle" font-size="14" font-weight="700" fill="#22543D">Milk-V Duo + IO 底板</text>
<text x="630" y="775" text-anchor="middle" font-size="12" fill="#276749">/dev/ttyUSB0 · duo_bridge.py</text>
<text x="630" y="795" text-anchor="middle" font-size="11" fill="#4A5568">视觉计数 · 卡号白名单 · 时间戳(NTP)</text>

<!-- ===== I2C 从机 ===== -->
<rect x="840" y="720" width="340" height="90" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="2"/>
<text x="1010" y="750" text-anchor="middle" font-size="13" font-weight="700" fill="#1A365D">I2C 总线从机</text>
<text x="1010" y="772" text-anchor="middle" font-size="12" fill="#2C5282">LCD1602 0x27/0x3F · OLED 0x3C</text>
<text x="1010" y="793" text-anchor="middle" font-size="11" fill="#4A5568">SDA=A4  SCL=A5，4.7kΩ 上拉至 5V</text>

