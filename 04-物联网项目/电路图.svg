<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900">
<title>单节点物联网终端 接线图</title>
<rect width="1240" height="900" fill="#ffffff"/>
<text x="40" y="46" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#1A202C">单节点物联网终端 · 接线图</text>
<text x="40" y="72" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#5A6B8C">Duo 提供语义 · UNO 提供物理事实 ｜ 电源分域：5V 逻辑 / 独立 5V 电机 / 3.3V 射频</text>

<g font-family="Microsoft YaHei,sans-serif">
<!-- ===== UNO ===== -->
<rect x="470" y="240" width="320" height="390" rx="12" fill="#E6FFFA" stroke="#234E52" stroke-width="2.5"/>
<text x="630" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#234E52">Arduino UNO R3 （16/16 引脚已满）</text>
<text x="630" y="600" text-anchor="middle" font-size="12" fill="#276749">5V · GND · 3V3  →  全部模块共地</text>
<text x="630" y="618" text-anchor="middle" font-size="11" fill="#718096">D0/D1 留给 USB</text>

<!-- 左侧信号引脚标签 -->
<g font-size="12" fill="#4A5568">
<text x="462" y="286" text-anchor="end">D2</text>
<text x="462" y="332" text-anchor="end">D3</text>
<text x="462" y="378" text-anchor="end">A0</text>
<text x="462" y="424" text-anchor="end">A1</text>
<text x="462" y="470" text-anchor="end">A2</text>
<text x="462" y="516" text-anchor="end">A4</text>
<text x="462" y="546" text-anchor="end">A5</text>
</g>
<!-- 右侧信号引脚标签 -->
<g font-size="12" fill="#4A5568">
<text x="798" y="286">D4</text>
<text x="798" y="332">D5</text>
<text x="798" y="378">D6</text>
<text x="798" y="424">D7</text>
<text x="798" y="477">D9</text>
