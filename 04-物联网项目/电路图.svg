<text x="798" y="559">D11</text>
<text x="798" y="584">D12</text>
<text x="798" y="609">D13</text>
</g>

<!-- ===== 左侧传感器 ===== -->
<g stroke="#2B6CB0" stroke-width="2" fill="#EBF4FF">
<rect x="60" y="260" width="270" height="44" rx="8"/>
<rect x="60" y="306" width="270" height="44" rx="8"/>
<rect x="60" y="352" width="270" height="44" rx="8"/>
<rect x="60" y="398" width="270" height="44" rx="8"/>
<rect x="60" y="444" width="270" height="44" rx="8"/>
<rect x="200" y="490" width="200" height="92" rx="8"/>
<rect x="60" y="491" width="130" height="18" rx="4"/>
<rect x="60" y="513" width="130" height="18" rx="4"/>
<rect x="60" y="535" width="130" height="18" rx="4"/>
<rect x="60" y="557" width="130" height="18" rx="4"/>
</g>
<g fill="#1A365D" font-size="13" text-anchor="middle">
<text x="195" y="288">DHT11 温湿度模块</text>
<text x="195" y="334">DS18B20 测温模块</text>
<text x="195" y="380">U 型光电 · 计数</text>
<text x="195" y="426">干簧管 · 门磁</text>
<text x="195" y="472">触摸模块 · 手动确认</text>
<text x="300" y="514">PCF8591 ← A4/A5</text>
<text x="300" y="538">I2C 0x48</text>
<text x="300" y="562">4 路模拟入</text>
</g>
<g fill="#2C5282" font-size="10.5" text-anchor="middle">
<text x="125" y="504">MQ-2 烟雾</text>
<text x="125" y="526">火焰</text>
<text x="125" y="548">光敏</text>
<text x="125" y="570">声音</text>
</g>

<!-- ===== 右侧执行器 ===== -->
<g stroke="#C05621" stroke-width="2" fill="#FFF5EB">
<rect x="840" y="260" width="340" height="44" rx="8"/>
<rect x="840" y="306" width="340" height="44" rx="8"/>
<rect x="840" y="352" width="340" height="44" rx="8"/>
<rect x="840" y="398" width="340" height="44" rx="8"/>
<rect x="840" y="444" width="340" height="58" rx="8"/>
<rect x="840" y="506" width="340" height="88" rx="8"/>
</g>
<g fill="#7B341E" font-size="13" text-anchor="middle">
<text x="1010" y="288">有源蜂鸣器（节奏报警）</text>
<text x="1010" y="334">7 色 LED 模块（状态色）</text>
<text x="1010" y="378">继电器模块 · 低电平吸合</text>
<text x="1010" y="426">舵机 SG90 · 门锁</text>
<text x="1010" y="470">风扇驱动：S8050 + 1kΩ 基极</text>
<text x="1010" y="490">风扇两端反并 1N4007 续流</text>
<text x="1010" y="528">RC522 RFID · 3.3V 供电</text>
<text x="1010" y="552">SDA→D10  SCK→D13</text>
<text x="1010" y="574">MOSI→D11  MISO→D12</text>
</g>
<g fill="#C05621" font-size="11" text-anchor="middle">
<text x="1010" y="590">信号经 BSS138 ×4 电平转换</text>
</g>

<!-- ===== 电源独立域 ===== -->
<rect x="840" y="612" width="340" height="44" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1010" y="640" text-anchor="middle" font-size="13" fill="#9B2C2C">独立 5V/2A（舵机 + 风扇专用）</text>

<!-- ===== 接线 ===== -->
<g stroke="#2D3748" stroke-width="1.7" fill="none">
<path d="M330 282 H470"/><path d="M330 328 H470"/><path d="M330 374 H470"/>
<path d="M330 420 H470"/><path d="M330 466 H470"/>
<path d="M400 514 H470"/><path d="M400 542 H470"/>
